<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参考例を管理 | Threads ジェネレーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 720px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 8px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .back-btn:hover { border-color: #555; color: #ccc; }

    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #f0f0f0;
      font-size: 14px;
      padding: 12px;
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
      line-height: 1.7;
    }

    textarea:focus { outline: none; border-color: #a855f7; }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    select {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .save-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .save-btn:hover { opacity: 0.9; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      color: #22c55e;
      font-size: 13px;
      display: none;
    }

    .examples-list { display: flex; flex-direction: column; gap: 12px; }

    .example-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      position: relative;
    }

    .example-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(168, 85, 247, 0.15);
      color: #a855f7;
      font-weight: 600;
    }

    .date-tag {
      font-size: 11px;
      color: #555;
    }

    .example-text {
      font-size: 14px;
      line-height: 1.8;
      color: #ccc;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 6px;
      color: #555;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover { border-color: #ef4444; color: #ef4444; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #444;
      font-size: 14px;
    }

    .loading { text-align: center; padding: 20px; color: #555; }

    .upload-area {
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.05);
    }

    .upload-area input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 参考例を管理</h1>
      <a href="/" class="back-btn">← 生成に戻る</a>
    </header>

    <!-- スクショから抽出 -->
    <div class="card">
      <h2>📸 スクショから文章を抽出</h2>
      <p style="font-size:13px; color:#666; margin-bottom:12px;">Threadsのバズり投稿のスクショをアップロードすると、文章を自動で読み取ります</p>
      <div class="upload-area" id="screenshotArea">
        <input type="file" id="screenshotInput" accept="image/*" multiple>
        <div style="font-size:32px; margin-bottom:8px;">📱</div>
        <p style="color:#666; font-size:13px;"><strong style="color:#a855f7;">クリックまたはドラッグ</strong>でスクショを追加</p>
      </div>
      <div id="extractStatus" style="display:none; margin-top:12px; color:#888; font-size:13px;"></div>
    </div>

    <div class="card">
      <h2>➕ 参考例を追加（テキスト入力）</h2>
      <textarea id="newContent" placeholder="バズった投稿文・手直しした文章などを貼り付けてください"></textarea>
      <div class="row">
        <select id="newBrand">
          <option value="">ブランドなし（共通）</option>
          <option value="DR.WU">DR.WU</option>
          <option value="MOEGI">MOEGI</option>
          <option value="KuON">KuON</option>
        </select>
        <button class="save-btn" id="saveBtn" onclick="saveExample()">💾 保存する</button>
        <span class="success-msg" id="successMsg">✓ 保存しました</span>
      </div>
    </div>

    <div class="card">
      <h2>📋 保存済み参考例 <span id="count" style="color:#555; font-weight:400;"></span></h2>
      <div class="loading" id="loading">読み込み中...</div>
      <div class="examples-list" id="examplesList"></div>
    </div>
  </div>

  <script>
    let examples = [];

    async function loadExamples() {
      try {
        const res = await fetch('/api/examples');
        examples = await res.json();
        renderExamples();
      } catch(e) {
        document.getElementById('loading').textContent = '読み込みエラー';
      }
    }

    function renderExamples() {
      const list = document.getElementById('examplesList');
      const loading = document.getElementById('loading');
      const count = document.getElementById('count');

      loading.style.display = 'none';
      count.textContent = `（${examples.length}件）`;

      if (examples.length === 0) {
        list.innerHTML = '<div class="empty-state">まだ参考例がありません。<br>上のフォームから追加してください。</div>';
        return;
      }

      list.innerHTML = '';
      examples.forEach((ex, i) => {
        const div = document.createElement('div');
        div.className = 'example-item';
        div.innerHTML = `
          <div class="example-meta">
            ${ex.brand ? `<span class="brand-tag">${escapeHtml(ex.brand)}</span>` : '<span class="brand-tag" style="background:rgba(100,100,100,0.15);color:#666;">共通</span>'}
            <span class="date-tag">${ex.created_at ? new Date(ex.created_at).toLocaleDateString('ja-JP') : ''}</span>
          </div>
          <div class="example-text">${escapeHtml(ex.content)}</div>
          <button class="delete-btn" onclick="deleteExample(${ex.id})">削除</button>
        `;
        list.appendChild(div);
      });
    }

    async function saveExample() {
      const content = document.getElementById('newContent').value.trim();
      const brand = document.getElementById('newBrand').value;
      if (!content) return;

      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('successMsg');
      btn.disabled = true;

      try {
        const res = await fetch('/api/examples', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, brand }),
        });

        if (res.ok) {
          document.getElementById('newContent').value = '';
          msg.style.display = 'inline';
          setTimeout(() => { msg.style.display = 'none'; }, 3000);
          loadExamples();
        }
      } catch(e) {
        alert('保存に失敗: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteExample(id) {
      if (!confirm('この参考例を削除しますか？')) return;
      try {
        await fetch(`/api/examples?id=${id}`, { method: 'DELETE' });
        loadExamples();
      } catch(e) {
        alert('削除に失敗: ' + e.message);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // スクショアップロード
    const screenshotInput = document.getElementById('screenshotInput');
    const screenshotArea = document.getElementById('screenshotArea');

    screenshotArea.addEventListener('dragover', (e) => { e.preventDefault(); screenshotArea.classList.add('dragover'); });
    screenshotArea.addEventListener('dragleave', () => screenshotArea.classList.remove('dragover'));
    screenshotArea.addEventListener('drop', (e) => { e.preventDefault(); screenshotArea.classList.remove('dragover'); handleScreenshots(e.dataTransfer.files); });
    screenshotInput.addEventListener('change', (e) => handleScreenshots(e.target.files));

    async function handleScreenshots(files) {
      const status = document.getElementById('extractStatus');
      status.style.display = 'block';
      status.textContent = `${files.length}枚のスクショを解析中...`;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        status.textContent = `解析中 ${i+1}/${files.length}...`;

        try {
          const base64 = await resizeAndEncode(file);
          const res = await fetch('/api/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ base64: base64.base64, mediaType: base64.mediaType }),
          });

          const data = await res.json();
          if (data.content) {
            await fetch('/api/examples', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: data.content, brand: '' }),
            });
          }
        } catch(e) {
          console.error(e);
        }
      }

      status.textContent = '✓ 完了！参考例に追加しました。';
      status.style.color = '#22c55e';
      screenshotInput.value = '';
      loadExamples();
    }

    function resizeAndEncode(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const MAX = 1024;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
              if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
              else { w = Math.round(w * MAX / h); h = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ base64: canvas.toDataURL('image/jpeg', 0.85).split(',')[1], mediaType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    loadExamples();
  </script>
</body>
</html>
