<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カルーセル投稿ジェネレーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 36px; }
    header h1 { font-size: 26px; font-weight: 700; color: #f0f0f0; margin-bottom: 8px; }
    header p { color: #666; font-size: 14px; }

    .nav { text-align: center; margin-bottom: 28px; }
    .nav a {
      color: #555; text-decoration: none; font-size: 13px;
      padding: 6px 14px; border: 1px solid #2a2a2a; border-radius: 20px;
      transition: all 0.2s; margin: 0 4px;
    }
    .nav a:hover { color: #aaa; border-color: #555; }

    .brand-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }

    .brand-btn {
      padding: 16px; border: 2px solid #2a2a2a; border-radius: 14px;
      background: #161616; color: #888; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit; text-align: center;
    }
    .brand-btn:hover { border-color: #555; color: #ccc; }
    .brand-btn.active.drwu { border-color: #5b9bd5; color: #5b9bd5; background: rgba(91,155,213,0.08); }
    .brand-btn.active.moegi { border-color: #6db36d; color: #6db36d; background: rgba(109,179,109,0.08); }
    .brand-btn small { display: block; font-size: 11px; font-weight: 400; margin-top: 4px; opacity: 0.7; }

    .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; font-weight: 600; color: #ccc; margin-bottom: 16px; }

    label { display: block; font-size: 13px; color: #777; margin-bottom: 6px; }

    input[type="text"], textarea {
      width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a;
      border-radius: 10px; color: #f0f0f0; font-size: 14px;
      padding: 11px 14px; font-family: inherit; transition: border-color 0.2s; margin-bottom: 14px;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #555; }
    textarea { resize: vertical; min-height: 80px; }

    /* 画像アップロード */
    .upload-area {
      border: 2px dashed #2a2a2a; border-radius: 12px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: all 0.2s; margin-bottom: 14px; background: #111;
    }
    .upload-area:hover, .upload-area.drag-over { border-color: #555; background: #161616; }
    .upload-area p { color: #555; font-size: 13px; line-height: 1.7; }
    .upload-area p strong { color: #888; }

    .image-previews {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }

    .preview-item {
      position: relative; width: 72px; height: 72px;
    }
    .preview-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid #2a2a2a; }
    .preview-item .remove-btn {
      position: absolute; top: -6px; right: -6px;
      width: 20px; height: 20px; background: #333; border: none;
      border-radius: 50%; color: #aaa; font-size: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-family: inherit;
    }
    .preview-item .remove-btn:hover { background: #555; color: #fff; }

    .generate-btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #3a7bd5, #2d62b8);
      border: none; border-radius: 12px; color: #fff;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s; margin-top: 4px; font-family: inherit;
    }
    .generate-btn.moegi-mode { background: linear-gradient(135deg, #5a9e5a, #448844); }
    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .loading { display: none; text-align: center; padding: 48px 24px; color: #666; }
    .loading.show { display: block; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #2a2a2a;
      border-top-color: #5b9bd5; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      display: none; background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3); border-radius: 10px;
      padding: 14px; color: #f87171; font-size: 14px; margin-top: 12px;
    }
    .error-box.show { display: block; }

    .results { display: none; margin-top: 24px; }
    .results.show { display: block; }

    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 11px 8px; background: #161616;
      border: 1px solid #2a2a2a; border-radius: 10px; color: #777;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .tab-btn:hover { border-color: #555; color: #ccc; }
    .tab-btn.active { background: rgba(91,155,213,0.1); border-color: #5b9bd5; color: #5b9bd5; }
    .tab-btn.active.moegi-tab { background: rgba(109,179,109,0.1); border-color: #6db36d; color: #6db36d; }

    .pattern-panel { display: none; }
    .pattern-panel.active { display: block; }

    .cover-box { background: #161616; border: 1px solid #2a2a2a; border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
    .cover-box h3 { font-size: 13px; color: #666; margin-bottom: 14px; }
    .hook-text { font-size: 22px; font-weight: 700; color: #f0f0f0; line-height: 1.4; margin-bottom: 6px; }
    .sub-text { font-size: 14px; color: #999; margin-bottom: 14px; }
    .cover-actions { display: flex; gap: 8px; }

    .slides-box { background: #161616; border: 1px solid #2a2a2a; border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
    .slides-box h3 { font-size: 13px; color: #666; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .slide-item { border: 1px solid #252525; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #111; }
    .slide-num { font-size: 11px; color: #555; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
    .slide-title { font-size: 15px; font-weight: 700; color: #e0e0e0; margin-bottom: 8px; }
    .slide-body { font-size: 14px; color: #bbb; line-height: 1.8; white-space: pre-wrap; }

    .prompt-box { background: rgba(91,155,213,0.05); border: 1px solid rgba(91,155,213,0.2); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
    .prompt-box h3 { font-size: 13px; color: #5b9bd5; margin-bottom: 14px; }
    .prompt-section { margin-bottom: 16px; }
    .prompt-label { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
    .prompt-text { font-size: 13px; color: #ccc; line-height: 1.7; white-space: pre-wrap; background: #0d0d0d; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }

    .copy-btn {
      padding: 6px 14px; background: transparent; border: 1px solid #333;
      border-radius: 8px; color: #777; font-size: 12px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .copy-btn:hover { border-color: #5b9bd5; color: #5b9bd5; }
    .copy-btn.copied { border-color: #22c55e; color: #22c55e; }
    .copy-btn.moegi:hover { border-color: #6db36d; color: #6db36d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/">← Threadsジェネレーター</a>
      <a href="/newsletter.html">メルマガ</a>
    </div>

    <header>
      <h1>📱 カルーセル投稿ジェネレーター</h1>
      <p>表紙フック・スライド内容・Canva制作指示書を2パターン生成</p>
    </header>

    <div class="brand-selector">
      <button class="brand-btn drwu active" id="btnDrwu" onclick="selectBrand('drwu')">
        DR.WU
        <small>台湾クリニカルスキンケア</small>
      </button>
      <button class="brand-btn moegi" id="btnMoegi" onclick="selectBrand('moegi')">
        MOEGI
        <small>植物発酵エキス</small>
      </button>
    </div>

    <div class="card">
      <h2>📝 投稿内容を入力</h2>

      <label>参考画像（商品スクショ・資料など、複数可）</label>
      <div class="upload-area" id="uploadArea"
        onclick="document.getElementById('fileInput').click()"
        ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <p><strong>クリックまたはドラッグ＆ドロップ</strong><br>商品スクショ・成分表・参考資料など<br>複数枚OK（PNG・JPG・WEBP）</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="onFileSelect(event)">
      <div class="image-previews" id="imagePreviews"></div>

      <label>伝えたいこと・テーマ <span style="color:#f87171">*</span></label>
      <textarea id="theme" placeholder="例：マンデリックセラム18%の商品詳細投稿。毛穴・ニキビ悩みの30代女性に向けて&#10;例：ヒアルコンプレクスの使い方投稿。乾燥肌の正しい保湿ケアの順番を教えたい&#10;例：MOEGIを使い始めてから体の内側の変化を感じた体験談ベースで紹介したい"></textarea>

      <label>追加情報（強調したいポイント・お客様の声など）</label>
      <textarea id="extra" placeholder="例：Qoo10角質ケア部門1位の実績を入れたい&#10;例：敏感肌でも使えることを強調したい" style="min-height:60px;"></textarea>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generate()">✨ カルーセルを生成する（2パターン）</button>

    <div class="error-box" id="errorBox"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>3パターンのスライドを生成中...<br><small style="color:#444">30〜45秒かかります</small></p>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    let currentBrand = 'drwu';
    let uploadedImages = [];

    function selectBrand(brand) {
      currentBrand = brand;
      document.getElementById('btnDrwu').className = 'brand-btn drwu' + (brand === 'drwu' ? ' active' : '');
      document.getElementById('btnMoegi').className = 'brand-btn moegi' + (brand === 'moegi' ? ' active' : '');
      document.getElementById('generateBtn').className = 'generate-btn' + (brand === 'moegi' ? ' moegi-mode' : '');
    }

    function onDragOver(e) { e.preventDefault(); document.getElementById('uploadArea').classList.add('drag-over'); }
    function onDragLeave(e) { document.getElementById('uploadArea').classList.remove('drag-over'); }
    function onDrop(e) {
      e.preventDefault();
      document.getElementById('uploadArea').classList.remove('drag-over');
      handleFiles(Array.from(e.dataTransfer.files));
    }
    function onFileSelect(e) { handleFiles(Array.from(e.target.files)); e.target.value = ''; }

    function handleFiles(files) {
      const imageFiles = files.filter(f => f.type.startsWith('image/'));
      imageFiles.forEach(file => resizeAndEncode(file).then(img => {
        uploadedImages.push(img);
        renderPreviews();
      }));
    }

    function resizeAndEncode(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const MAX = 1024;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
              if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
              else { w = Math.round(w * MAX / h); h = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            const b64 = dataUrl.split(',')[1];
            resolve({ base64: b64, mediaType: 'image/jpeg', dataUrl, name: file.name });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      const container = document.getElementById('imagePreviews');
      container.innerHTML = '';
      uploadedImages.forEach((img, i) => {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `
          <img src="${img.dataUrl}" alt="${img.name}">
          <button class="remove-btn" onclick="removeImage(${i})">×</button>
        `;
        container.appendChild(item);
      });
    }

    function removeImage(i) {
      uploadedImages.splice(i, 1);
      renderPreviews();
    }

    async function generate() {
      const errorBox = document.getElementById('errorBox');
      const loading = document.getElementById('loading');
      const results = document.getElementById('results');
      const btn = document.getElementById('generateBtn');

      errorBox.classList.remove('show');
      results.classList.remove('show');
      results.innerHTML = '';

      const theme = document.getElementById('theme').value.trim();
      if (!theme) {
        errorBox.textContent = 'テーマ・伝えたいことを入力してください';
        errorBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      loading.classList.add('show');

      try {
        const res = await fetch('/api/carousel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            brand: currentBrand,
            theme,
            extra: document.getElementById('extra').value.trim(),
            images: uploadedImages.map(({ base64, mediaType }) => ({ base64, mediaType })),
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '生成に失敗しました');
        renderResults(data.result);
      } catch (err) {
        errorBox.textContent = `エラー: ${err.message}`;
        errorBox.classList.add('show');
      } finally {
        btn.disabled = false;
        loading.classList.remove('show');
      }
    }

    function parseSection(text, name) {
      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`===\\s*${escaped}\\s*===\\n([\\s\\S]*?)(?====|$)`);
      const m = text.match(re);
      return m ? m[1].trim() : '';
    }

    function parseSlides(slidesText) {
      const slides = [];
      const blocks = slidesText.split(/(?=【スライド\d+】)/);
      for (const block of blocks) {
        if (!block.trim()) continue;
        const titleMatch = block.match(/【スライド(\d+)】タイトル[：:]\s*(.+)/);
        const bodyMatch = block.match(/本文[：:]\s*([\s\S]+)/);
        if (titleMatch) {
          slides.push({
            num: titleMatch[1],
            title: titleMatch[2].trim(),
            body: bodyMatch ? bodyMatch[1].trim() : '',
          });
        }
      }
      return slides;
    }

    function parseDesignPrompt(promptText) {
      const coverMatch = promptText.match(/【表紙】\s*([\s\S]*?)(?=【スライド|$)/);
      const slideMatch = promptText.match(/(【スライド[\s\S]*?)$/);
      return {
        cover: coverMatch ? coverMatch[1].trim() : '',
        slide: slideMatch ? slideMatch[1].trim() : '',
      };
    }

    function parseCover(coverText) {
      const hookMatch = coverText.match(/フックコピー[：:]\s*(.+)/);
      const subMatch = coverText.match(/サブコピー[：:]\s*(.+)/);
      return {
        hook: hookMatch ? hookMatch[1].trim() : coverText,
        sub: subMatch ? subMatch[1].trim() : '',
      };
    }

    function renderResults(text) {
      const results = document.getElementById('results');
      const isMoegi = currentBrand === 'moegi';
      const tabBar = document.createElement('div');
      tabBar.className = 'tab-bar';
      const panels = [];

      for (let i = 1; i <= 2; i++) {
        const coverText = parseSection(text, `パターン${i}表紙`);
        const slidesText = parseSection(text, `パターン${i}スライド`);
        const promptText = parseSection(text, `パターン${i}制作指示`);
        const cover = parseCover(coverText);
        const slides = parseSlides(slidesText);
        const design = parseDesignPrompt(promptText);

        const tabBtn = document.createElement('button');
        tabBtn.className = 'tab-btn' + (i === 1 ? ' active' + (isMoegi ? ' moegi-tab' : '') : '');
        tabBtn.textContent = `パターン${i}`;
        const idx = i - 1;
        tabBtn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'moegi-tab'));
          document.querySelectorAll('.pattern-panel').forEach(p => p.classList.remove('active'));
          tabBtn.classList.add('active');
          if (isMoegi) tabBtn.classList.add('moegi-tab');
          panels[idx].classList.add('active');
        });
        tabBar.appendChild(tabBtn);

        const panel = document.createElement('div');
        panel.className = 'pattern-panel' + (i === 1 ? ' active' : '');

        // 表紙
        const coverBox = document.createElement('div');
        coverBox.className = 'cover-box';
        coverBox.innerHTML = '<h3>🖼 表紙コピー</h3>';
        const hookEl = document.createElement('div');
        hookEl.className = 'hook-text';
        hookEl.textContent = cover.hook;
        const subEl = document.createElement('div');
        subEl.className = 'sub-text';
        subEl.textContent = cover.sub;
        const actions = document.createElement('div');
        actions.className = 'cover-actions';
        [['フックコピー', cover.hook], ['サブコピー', cover.sub]].forEach(([label, val]) => {
          const btn = document.createElement('button');
          btn.className = 'copy-btn' + (isMoegi ? ' moegi' : '');
          btn.textContent = label;
          btn.addEventListener('click', () => copyText(btn, val));
          actions.appendChild(btn);
        });
        coverBox.appendChild(hookEl);
        coverBox.appendChild(subEl);
        coverBox.appendChild(actions);
        panel.appendChild(coverBox);

        // スライド
        if (slides.length > 0) {
          const slidesBox = document.createElement('div');
          slidesBox.className = 'slides-box';
          const h3 = document.createElement('h3');
          h3.textContent = '📄 スライド内容';
          const copyAllBtn = document.createElement('button');
          copyAllBtn.className = 'copy-btn' + (isMoegi ? ' moegi' : '');
          copyAllBtn.textContent = '全スライドコピー';
          const allText = slides.map(s => `【スライド${s.num}】${s.title}\n${s.body}`).join('\n\n');
          copyAllBtn.addEventListener('click', () => copyText(copyAllBtn, allText));
          h3.appendChild(copyAllBtn);
          slidesBox.appendChild(h3);
          slides.forEach(slide => {
            const item = document.createElement('div');
            item.className = 'slide-item';
            item.innerHTML = `<div class="slide-num">SLIDE ${slide.num}</div><div class="slide-title">${esc(slide.title)}</div><div class="slide-body">${esc(slide.body)}</div>`;
            slidesBox.appendChild(item);
          });
          panel.appendChild(slidesBox);
        }

        // デザインプロンプト
        if (design.cover || design.slide) {
          const promptBox = document.createElement('div');
          promptBox.className = 'prompt-box';
          promptBox.innerHTML = '<h3>🎨 Canva制作指示書</h3>';
          [['表紙', design.cover], ['スライド構成メモ', design.slide]].forEach(([label, val]) => {
            if (!val) return;
            const sec = document.createElement('div');
            sec.className = 'prompt-section';
            const labelEl = document.createElement('div');
            labelEl.className = 'prompt-label';
            labelEl.textContent = label;
            const textEl = document.createElement('div');
            textEl.className = 'prompt-text';
            textEl.textContent = val;
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn' + (isMoegi ? ' moegi' : '');
            copyBtn.textContent = 'コピー';
            copyBtn.addEventListener('click', () => copyText(copyBtn, val));
            sec.appendChild(labelEl);
            sec.appendChild(textEl);
            sec.appendChild(copyBtn);
            promptBox.appendChild(sec);
          });
          panel.appendChild(promptBox);
        }

        panels.push(panel);
      }

      results.appendChild(tabBar);
      panels.forEach(p => results.appendChild(p));
      results.classList.add('show');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function copyText(btn, text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ コピー済み';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
      });
    }

    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
