<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カルーセル投稿ジェネレーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #0a0a0a; color: #f0f0f0; min-height: 100vh; padding: 24px 16px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    .nav { text-align: center; margin-bottom: 28px; }
    .nav a {
      color: #555; text-decoration: none; font-size: 13px;
      padding: 6px 14px; border: 1px solid #2a2a2a; border-radius: 20px;
      transition: all 0.2s; margin: 0 4px;
    }
    .nav a:hover { color: #aaa; border-color: #555; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 26px; font-weight: 700; color: #f0f0f0; margin-bottom: 6px; }
    header p { color: #555; font-size: 13px; }

    /* ブランド選択 */
    .brand-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .brand-btn {
      padding: 14px; border: 2px solid #2a2a2a; border-radius: 14px;
      background: #161616; color: #777; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit; text-align: center;
    }
    .brand-btn small { display: block; font-size: 11px; font-weight: 400; margin-top: 3px; opacity: 0.6; }
    .brand-btn.active.drwu { border-color: #5b9bd5; color: #5b9bd5; background: rgba(91,155,213,0.08); }
    .brand-btn.active.moegi { border-color: #6db36d; color: #6db36d; background: rgba(109,179,109,0.08); }

    /* モード切替 */
    .mode-toggle { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; }
    .mode-btn {
      flex: 1; padding: 13px; background: #111; border: none; color: #666;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .mode-btn:first-child { border-right: 1px solid #2a2a2a; }
    .mode-btn.active { background: #1e1e1e; color: #f0f0f0; }

    /* カード */
    .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 16px; padding: 22px; margin-bottom: 16px; }
    .card h2 { font-size: 14px; font-weight: 600; color: #888; margin-bottom: 16px; }

    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }

    input[type="text"], textarea {
      width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a;
      border-radius: 10px; color: #f0f0f0; font-size: 14px;
      padding: 11px 14px; font-family: inherit; transition: border-color 0.2s; margin-bottom: 14px;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #444; }
    textarea { resize: vertical; min-height: 80px; }

    /* 画像アップロード */
    .upload-area {
      border: 2px dashed #2a2a2a; border-radius: 12px;
      padding: 18px; text-align: center; cursor: pointer;
      transition: all 0.2s; margin-bottom: 14px; background: #111;
    }
    .upload-area:hover, .upload-area.drag-over { border-color: #444; }
    .upload-area p { color: #444; font-size: 13px; line-height: 1.6; }
    .upload-area p strong { color: #666; }
    .image-previews { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .preview-item { position: relative; width: 68px; height: 68px; }
    .preview-item img { width: 68px; height: 68px; object-fit: cover; border-radius: 8px; border: 1px solid #2a2a2a; }
    .remove-btn {
      position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
      background: #333; border: none; border-radius: 50%; color: #aaa;
      font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .remove-btn:hover { background: #555; }

    /* スライドテキスト入力（指示書モード） */
    .slide-inputs { display: flex; flex-direction: column; gap: 12px; }
    .slide-input-item {}
    .slide-input-label {
      font-size: 12px; font-weight: 700; color: #555; margin-bottom: 6px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .slide-input-item textarea { margin-bottom: 0; min-height: 90px; }

    /* ボタン */
    .generate-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #3a7bd5, #2d62b8);
      border: none; border-radius: 12px; color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s; margin-top: 4px; font-family: inherit;
    }
    .generate-btn.moegi-mode { background: linear-gradient(135deg, #5a9e5a, #448844); }
    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .loading { display: none; text-align: center; padding: 48px 24px; color: #555; }
    .loading.show { display: block; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #222;
      border-top-color: #5b9bd5; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      display: none; background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3); border-radius: 10px;
      padding: 12px 14px; color: #f87171; font-size: 14px; margin-top: 12px;
    }
    .error-box.show { display: block; }

    /* 結果エリア */
    .results { display: none; margin-top: 24px; }
    .results.show { display: block; }

    /* 表紙 */
    .cover-box {
      background: #161616; border: 1px solid #2a2a2a;
      border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
    }
    .cover-label { font-size: 12px; color: #555; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.5px; }
    .hook-text { font-size: 22px; font-weight: 700; color: #f0f0f0; line-height: 1.4; margin-bottom: 6px; }
    .sub-text { font-size: 14px; color: #888; margin-bottom: 16px; line-height: 1.6; }
    .cover-actions { display: flex; gap: 8px; }

    /* スライドカード */
    .slide-result {
      background: #111; border: 1px solid #222;
      border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
    }
    .slide-result-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .slide-num-badge { font-size: 11px; font-weight: 700; color: #555; letter-spacing: 0.5px; }
    .slide-result-text { font-size: 14px; color: #ccc; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }

    /* 指示書結果 */
    .design-result { background: #161616; border: 1px solid rgba(91,155,213,0.2); border-radius: 14px; padding: 20px 22px; margin-bottom: 12px; }
    .design-result-label { font-size: 12px; color: #5b9bd5; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .design-result-text { font-size: 13px; color: #ccc; line-height: 1.7; white-space: pre-wrap; font-family: 'Courier New', monospace; background: #0d0d0d; border-radius: 8px; padding: 14px; }

    /* コピーボタン */
    .copy-btn {
      padding: 5px 12px; background: transparent; border: 1px solid #333;
      border-radius: 7px; color: #666; font-size: 12px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; font-family: inherit; flex-shrink: 0;
    }
    .copy-btn:hover { border-color: #5b9bd5; color: #5b9bd5; }
    .copy-btn.moegi:hover { border-color: #6db36d; color: #6db36d; }
    .copy-btn.copied { border-color: #22c55e; color: #22c55e; }

    .copy-all-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }

    .mode-section { display: none; }
    .mode-section.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/">← Threads</a>
      <a href="/newsletter.html">メルマガ</a>
    </div>

    <header>
      <h1>📱 カルーセルジェネレーター</h1>
      <p>スライドテキスト生成 ／ Canva制作指示書変換</p>
    </header>

    <!-- ブランド選択 -->
    <div class="brand-selector">
      <button class="brand-btn drwu active" id="btnDrwu" onclick="selectBrand('drwu')">
        DR.WU <small>台湾クリニカルスキンケア</small>
      </button>
      <button class="brand-btn moegi" id="btnMoegi" onclick="selectBrand('moegi')">
        MOEGI <small>植物発酵エキス</small>
      </button>
    </div>

    <!-- モード切替 -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeTextBtn" onclick="switchMode('text')">✍️ テキスト生成</button>
      <button class="mode-btn" id="modeDesignBtn" onclick="switchMode('design')">🎨 指示書に変換</button>
    </div>

    <!-- テキスト生成モード -->
    <div class="mode-section active" id="sectionText">
      <div class="card">
        <h2>投稿内容を入力</h2>

        <label>参考画像（商品スクショ・資料など）</label>
        <div class="upload-area" id="uploadArea"
          onclick="document.getElementById('fileInput').click()"
          ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
          <p><strong>クリックまたはドラッグ＆ドロップ</strong><br>商品スクショ・成分表など 複数枚OK</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="onFileSelect(event)">
        <div class="image-previews" id="imagePreviews"></div>

        <label>伝えたいこと・テーマ <span style="color:#f87171">*</span></label>
        <textarea id="theme" placeholder="例：マンデリックセラム18%の商品詳細。毛穴・ニキビ悩みの30代女性向け&#10;例：ヒアルコンプレクスの使い方。乾燥肌の正しい保湿ケアの順番&#10;例：MOEGIを飲んで体の内側から変わった体験談ベースで紹介"></textarea>

        <label>追加情報（強調ポイント・お客様の声など）</label>
        <textarea id="extra" placeholder="例：Qoo10角質ケア部門1位を入れたい&#10;例：敏感肌でも使えることを強調したい" style="min-height:60px;"></textarea>
      </div>

      <button class="generate-btn" id="generateTextBtn" onclick="generateText()">✨ スライドテキストを生成する</button>
    </div>

    <!-- 指示書変換モード -->
    <div class="mode-section" id="sectionDesign">
      <div class="card">
        <h2>スライドテキストを貼り付け</h2>
        <div class="slide-inputs" id="slideInputs"></div>
      </div>

      <div class="card">
        <label>補足情報（シリーズ・カラーイメージなど）</label>
        <input type="text" id="colorHint" placeholder="例：マンデリックシリーズ（赤）、ミニマルでクールな雰囲気">
      </div>

      <button class="generate-btn" id="generateDesignBtn" onclick="generateDesign()">🎨 Canva制作指示書を生成する</button>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingMsg">生成中...<br><small style="color:#333">20〜40秒かかります</small></p>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    let currentBrand = 'drwu';
    let uploadedImages = [];
    let currentMode = 'text';

    // スライド入力欄を生成
    function buildSlideInputs() {
      const container = document.getElementById('slideInputs');
      container.innerHTML = '';
      const labels = ['スライド1（表紙）', 'スライド2', 'スライド3', 'スライド4', 'スライド5', 'スライド6', 'スライド7'];
      labels.forEach((lbl, i) => {
        const div = document.createElement('div');
        div.className = 'slide-input-item';
        div.innerHTML = `<div class="slide-input-label">${lbl}</div>`;
        const ta = document.createElement('textarea');
        ta.id = `slide${i + 1}`;
        ta.placeholder = i === 0 ? 'フックコピー・サブコピーを貼り付け' : `スライド${i + 1}のテキストを貼り付け`;
        div.appendChild(ta);
        container.appendChild(div);
      });
    }
    buildSlideInputs();

    function selectBrand(brand) {
      currentBrand = brand;
      document.getElementById('btnDrwu').className = 'brand-btn drwu' + (brand === 'drwu' ? ' active' : '');
      document.getElementById('btnMoegi').className = 'brand-btn moegi' + (brand === 'moegi' ? ' active' : '');
      const isMoegi = brand === 'moegi';
      document.getElementById('generateTextBtn').className = 'generate-btn' + (isMoegi ? ' moegi-mode' : '');
      document.getElementById('generateDesignBtn').className = 'generate-btn' + (isMoegi ? ' moegi-mode' : '');
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('modeTextBtn').className = 'mode-btn' + (mode === 'text' ? ' active' : '');
      document.getElementById('modeDesignBtn').className = 'mode-btn' + (mode === 'design' ? ' active' : '');
      document.getElementById('sectionText').className = 'mode-section' + (mode === 'text' ? ' active' : '');
      document.getElementById('sectionDesign').className = 'mode-section' + (mode === 'design' ? ' active' : '');
      document.getElementById('results').classList.remove('show');
      document.getElementById('results').innerHTML = '';
      document.getElementById('errorBox').classList.remove('show');
    }

    // 画像処理
    function onDragOver(e) { e.preventDefault(); document.getElementById('uploadArea').classList.add('drag-over'); }
    function onDragLeave() { document.getElementById('uploadArea').classList.remove('drag-over'); }
    function onDrop(e) { e.preventDefault(); document.getElementById('uploadArea').classList.remove('drag-over'); handleFiles(Array.from(e.dataTransfer.files)); }
    function onFileSelect(e) { handleFiles(Array.from(e.target.files)); e.target.value = ''; }
    function handleFiles(files) {
      files.filter(f => f.type.startsWith('image/')).forEach(file => resizeAndEncode(file).then(img => { uploadedImages.push(img); renderPreviews(); }));
    }
    function resizeAndEncode(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const MAX = 1024; let w = img.width, h = img.height;
            if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const b64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            resolve({ base64: b64, mediaType: 'image/jpeg', dataUrl: canvas.toDataURL('image/jpeg', 0.85), name: file.name });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    function renderPreviews() {
      const container = document.getElementById('imagePreviews');
      container.innerHTML = '';
      uploadedImages.forEach((img, i) => {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `<img src="${img.dataUrl}"><button class="remove-btn" onclick="removeImage(${i})">×</button>`;
        container.appendChild(item);
      });
    }
    function removeImage(i) { uploadedImages.splice(i, 1); renderPreviews(); }

    // テキスト生成
    async function generateText() {
      const theme = document.getElementById('theme').value.trim();
      if (!theme) { showError('テーマを入力してください'); return; }
      document.getElementById('loadingMsg').innerHTML = 'スライドテキストを生成中...<br><small style="color:#333">20〜40秒かかります</small>';
      startLoading('generateTextBtn');
      try {
        const res = await fetch('/api/carousel', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            brand: currentBrand, theme,
            extra: document.getElementById('extra').value.trim(),
            images: uploadedImages.map(({ base64, mediaType }) => ({ base64, mediaType })),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '生成に失敗しました');
        renderTextResults(data.result);
      } catch (err) { showError(err.message); }
      finally { stopLoading('generateTextBtn'); }
    }

    // 指示書変換
    async function generateDesign() {
      const slides = [];
      for (let i = 1; i <= 7; i++) {
        slides.push((document.getElementById(`slide${i}`)?.value || '').trim());
      }
      if (slides.every(s => !s)) { showError('スライドテキストを入力してください'); return; }
      document.getElementById('loadingMsg').innerHTML = 'Canva制作指示書を生成中...<br><small style="color:#333">20〜40秒かかります</small>';
      startLoading('generateDesignBtn');
      try {
        const res = await fetch('/api/carousel-design', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            brand: currentBrand, slides,
            colorHint: document.getElementById('colorHint').value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '生成に失敗しました');
        renderDesignResults(data.result);
      } catch (err) { showError(err.message); }
      finally { stopLoading('generateDesignBtn'); }
    }

    function startLoading(btnId) {
      document.getElementById(btnId).disabled = true;
      document.getElementById('loading').classList.add('show');
      document.getElementById('results').classList.remove('show');
      document.getElementById('results').innerHTML = '';
      document.getElementById('errorBox').classList.remove('show');
    }
    function stopLoading(btnId) {
      document.getElementById(btnId).disabled = false;
      document.getElementById('loading').classList.remove('show');
    }
    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = `エラー: ${msg}`;
      box.classList.add('show');
    }

    // テキスト生成結果のレンダリング
    function renderTextResults(text) {
      const results = document.getElementById('results');
      const isMoegi = currentBrand === 'moegi';
      const accentColor = isMoegi ? '#6db36d' : '#5b9bd5';

      // 表紙パース
      const coverRaw = parseSection(text, '表紙');
      const hookMatch = coverRaw.match(/フックコピー[：:]\s*\*{0,2}(.+?)\*{0,2}$/m);
      const subMatch = coverRaw.match(/サブコピー[：:]\s*\*{0,2}(.+?)\*{0,2}$/m);
      const hook = hookMatch ? hookMatch[1].trim() : coverRaw.replace(/\*\*/g, '').trim();
      const sub = subMatch ? subMatch[1].trim() : '';

      // 表紙カード
      const coverBox = document.createElement('div');
      coverBox.className = 'cover-box';
      coverBox.innerHTML = `<div class="cover-label">SLIDE 1 / 表紙</div>
        <div class="hook-text">${esc(hook)}</div>
        <div class="sub-text">${esc(sub)}</div>`;
      const actions = document.createElement('div');
      actions.className = 'cover-actions';
      [['フックコピー', hook], ['サブコピー', sub]].forEach(([label, val]) => {
        const btn = makeCopyBtn(label, val, isMoegi);
        actions.appendChild(btn);
      });
      coverBox.appendChild(actions);
      results.appendChild(coverBox);

      // スライド2〜7
      const copyAllTexts = [`【スライド1】\n${hook}\n${sub}`];
      for (let i = 2; i <= 7; i++) {
        const slideText = parseSection(text, `スライド${i}`);
        if (!slideText) continue;
        copyAllTexts.push(`【スライド${i}】\n${slideText}`);
        const card = document.createElement('div');
        card.className = 'slide-result';
        const header = document.createElement('div');
        header.className = 'slide-result-header';
        const badge = document.createElement('div');
        badge.className = 'slide-num-badge';
        badge.textContent = `SLIDE ${i}`;
        const copyBtn = makeCopyBtn('コピー', slideText, isMoegi);
        header.appendChild(badge);
        header.appendChild(copyBtn);
        const textEl = document.createElement('div');
        textEl.className = 'slide-result-text';
        textEl.textContent = slideText;
        card.appendChild(header);
        card.appendChild(textEl);
        results.appendChild(card);
      }

      // 全コピーボタン
      const allRow = document.createElement('div');
      allRow.className = 'copy-all-row';
      const allBtn = makeCopyBtn('📋 全スライドまとめてコピー', copyAllTexts.join('\n\n'), isMoegi);
      allBtn.style.padding = '8px 16px';
      allRow.appendChild(allBtn);
      results.insertBefore(allRow, results.firstChild);

      results.classList.add('show');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 指示書結果のレンダリング
    function renderDesignResults(text) {
      const results = document.getElementById('results');
      const isMoegi = currentBrand === 'moegi';

      for (let i = 1; i <= 7; i++) {
        const sectionText = parseSection(text, `スライド${i}`);
        if (!sectionText) continue;
        const card = document.createElement('div');
        card.className = 'design-result';
        const label = document.createElement('div');
        label.className = 'design-result-label';
        label.innerHTML = `<span>SLIDE ${i}${i === 1 ? ' / 表紙' : ''}</span>`;
        const copyBtn = makeCopyBtn('コピー', sectionText, isMoegi);
        label.appendChild(copyBtn);
        const textEl = document.createElement('div');
        textEl.className = 'design-result-text';
        textEl.textContent = sectionText;
        card.appendChild(label);
        card.appendChild(textEl);
        results.appendChild(card);
      }

      results.classList.add('show');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function parseSection(text, name) {
      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`===\\s*${escaped}\\s*===\\n([\\s\\S]*?)(?====|$)`);
      const m = text.match(re);
      return m ? m[1].trim() : '';
    }

    function makeCopyBtn(label, val, isMoegi) {
      const btn = document.createElement('button');
      btn.className = 'copy-btn' + (isMoegi ? ' moegi' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(val).then(() => {
          const orig = btn.textContent;
          btn.textContent = '✓ コピー済み';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
        });
      });
      return btn;
    }

    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
