<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOEGI メルマガジェネレーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 720px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 40px; }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #d4a843, #e8c96b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p { color: #888; font-size: 14px; }

    .insight {
      background: rgba(212, 168, 67, 0.08);
      border: 1px solid rgba(212, 168, 67, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #d4a843;
      line-height: 1.7;
    }

    .insight strong { display: block; margin-bottom: 6px; font-size: 14px; }

    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #f0f0f0;
      font-size: 14px;
      padding: 12px;
      font-family: inherit;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #d4a843;
    }

    textarea { resize: vertical; min-height: 80px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .generate-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #d4a843, #c49030);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading { display: none; text-align: center; padding: 40px; color: #888; }
    .loading.show { display: block; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2a2a;
      border-top-color: #d4a843;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: none; }
    .results.show { display: block; }

    /* タブ */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn:hover { border-color: #d4a843; color: #d4a843; }
    .tab-btn.active {
      background: rgba(212, 168, 67, 0.1);
      border-color: #d4a843;
      color: #d4a843;
    }

    .pattern-panel { display: none; }
    .pattern-panel.active { display: block; }

    /* 件名 */
    .subject-box {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .subject-box h3 {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
    }

    .subject-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .subject-text {
      font-size: 17px;
      color: #f0f0f0;
      font-weight: 600;
      flex: 1;
      line-height: 1.5;
    }

    /* 本文 */
    .body-box {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .body-box h3 {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .body-text {
      font-size: 15px;
      line-height: 2;
      color: #e8e8e8;
      white-space: pre-wrap;
      word-break: break-word;
      background: #111;
      border-radius: 10px;
      padding: 20px;
    }

    /* 改善ポイント */
    .insight-box {
      background: rgba(212, 168, 67, 0.05);
      border: 1px solid rgba(212, 168, 67, 0.15);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .insight-box h3 {
      font-size: 14px;
      color: #d4a843;
      margin-bottom: 10px;
    }

    .insight-box p {
      font-size: 14px;
      color: #bbb;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .copy-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 8px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: inherit;
    }

    .copy-btn:hover { border-color: #d4a843; color: #d4a843; }
    .copy-btn.copied { border-color: #22c55e; color: #22c55e; }

    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 14px;
      color: #f87171;
      font-size: 14px;
      margin-top: 16px;
    }

    .error-box.show { display: block; }

    .nav {
      text-align: center;
      margin-bottom: 32px;
    }

    .nav a {
      color: #555;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .nav a:hover { color: #d4a843; border-color: #d4a843; }

    .mode-tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .mode-tab {
      flex: 1;
      padding: 12px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      text-align: center;
    }

    .mode-tab:hover { border-color: #d4a843; color: #d4a843; }
    .mode-tab.active { background: rgba(212,168,67,0.1); border-color: #d4a843; color: #d4a843; }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .change-box {
      background: rgba(34,197,94,0.05);
      border: 1px solid rgba(34,197,94,0.2);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .change-box h3 { font-size: 14px; color: #22c55e; margin-bottom: 10px; }
    .change-box p { font-size: 14px; color: #bbb; line-height: 1.7; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/">← Threadsジェネレーターに戻る</a>
    </div>

    <header>
      <h1>✉ MOEGI メルマガジェネレーター</h1>
      <p>新規作成 / 既存文章のブラッシュアップに対応</p>
    </header>

    <div class="insight">
      <strong>📊 あなたのデータから学んだこと</strong>
      購入につながった共通点：<b>期限・限定感</b>＋<b>具体的な体験・変化</b><br>
      CTR高いのに購入0の原因：「今買う理由」が弱い → このアプリが自動で補完します
    </div>

    <!-- モード切り替え -->
    <div class="mode-tab-bar">
      <button class="mode-tab active" onclick="switchMode('new', this)">✨ 新規作成（3パターン）</button>
      <button class="mode-tab" onclick="switchMode('polish', this)">✏️ ブラッシュアップ</button>
    </div>

    <!-- 新規作成 -->
    <div class="mode-panel active" id="panel-new">
      <div class="card">
        <h2>📝 メルマガの内容を入力</h2>

        <label>テーマ・伝えたいこと <span style="color:#f87171">*</span></label>
        <textarea id="theme" placeholder="例：夏の紫外線ダメージケアにMOEGIを紹介したい&#10;例：定期購入の特典を改めてアピールしたい&#10;例：梅雨時期の体のだるさ・むくみ対策"></textarea>

        <div class="row">
          <div>
            <label>緊急性・期限（あれば）</label>
            <input type="text" id="urgency" placeholder="例：6月末まで10%OFF、在庫残りわずか">
          </div>
          <div>
            <label>季節・時期の背景</label>
            <input type="text" id="season" placeholder="例：梅雨入り、夏前の体づくり">
          </div>
        </div>

        <label>追加情報（体験談・キャンペーン詳細など）</label>
        <textarea id="extra" placeholder="例：先月、お客様から「飲み始めて2週間で体が軽くなった」という声をいただいた&#10;例：今回はケストースを一緒に紹介したい"></textarea>
      </div>

      <button class="generate-btn" onclick="generateNew()">✨ メルマガを生成する（3パターン）</button>
    </div>

    <!-- ブラッシュアップ -->
    <div class="mode-panel" id="panel-polish">
      <div class="card">
        <h2>✏️ ブラッシュアップしたい文章を貼り付け</h2>

        <label>元の文章（件名＋本文）<span style="color:#f87171">*</span></label>
        <textarea id="draft" style="min-height:200px" placeholder="件名：〇〇&#10;&#10;{name} 様&#10;&#10;本文をここに貼り付けてください..."></textarea>

        <label>修正の方向性・注意点（あれば）</label>
        <textarea id="notes" placeholder="例：冒頭が長すぎるので短くしたい&#10;例：ケストース特典を追加したい&#10;例：もっと購買につながる文章にしたい"></textarea>
      </div>

      <button class="generate-btn" onclick="generatePolish()">✏️ ブラッシュアップする</button>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText">生成中...<br><small style="color:#555">30〜40秒かかります</small></p>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    function switchMode(mode, btn) {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + mode).classList.add('active');
      document.getElementById('errorBox').classList.remove('show');
      document.getElementById('results').classList.remove('show');
      document.getElementById('results').innerHTML = '';
    }

    async function callAPI(body, loadingText) {
      const errorBox = document.getElementById('errorBox');
      const loading = document.getElementById('loading');
      const results = document.getElementById('results');
      const btns = document.querySelectorAll('.generate-btn');

      errorBox.classList.remove('show');
      results.classList.remove('show');
      results.innerHTML = '';
      document.getElementById('loadingText').innerHTML = loadingText;
      btns.forEach(b => b.disabled = true);
      loading.classList.add('show');

      try {
        const res = await fetch('/api/newsletter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '生成に失敗しました');
        return data.result;
      } catch (err) {
        errorBox.textContent = `エラー: ${err.message}`;
        errorBox.classList.add('show');
        return null;
      } finally {
        btns.forEach(b => b.disabled = false);
        loading.classList.remove('show');
      }
    }

    async function generateNew() {
      const theme = document.getElementById('theme').value.trim();
      if (!theme) {
        const e = document.getElementById('errorBox');
        e.textContent = 'テーマを入力してください';
        e.classList.add('show');
        return;
      }
      const result = await callAPI({
        mode: 'new',
        theme,
        urgency: document.getElementById('urgency').value.trim(),
        season: document.getElementById('season').value.trim(),
        extra: document.getElementById('extra').value.trim(),
      }, '過去データを分析して売れる文章を3パターン生成中...<br><small style="color:#555">30〜40秒かかります</small>');
      if (result) renderNew(result);
    }

    async function generatePolish() {
      const draft = document.getElementById('draft').value.trim();
      if (!draft) {
        const e = document.getElementById('errorBox');
        e.textContent = '元の文章を入力してください';
        e.classList.add('show');
        return;
      }
      const result = await callAPI({
        mode: 'polish',
        draft,
        notes: document.getElementById('notes').value.trim(),
      }, 'ブラッシュアップ中...<br><small style="color:#555">20〜30秒かかります</small>');
      if (result) renderPolish(result);
    }

    function parseSection(text, name) {
      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`===\\s*${escaped}\\s*===\\n([\\s\\S]*?)(?====|$)`);
      const m = text.match(re);
      return m ? m[1].trim() : '';
    }

    function renderPolish(text) {
      const results = document.getElementById('results');
      results.innerHTML = '';

      const subject = parseSection(text, 'ブラッシュアップ件名');
      const body = parseSection(text, 'ブラッシュアップ本文');
      const changes = parseSection(text, '変更ポイント');

      if (subject) {
        const box = document.createElement('div');
        box.className = 'subject-box';
        box.innerHTML = '<h3>✉ 件名</h3>';
        const row = document.createElement('div');
        row.className = 'subject-row';
        const span = document.createElement('span');
        span.className = 'subject-text';
        span.textContent = subject;
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'コピー';
        btn.addEventListener('click', () => copyText(btn, subject));
        row.appendChild(span);
        row.appendChild(btn);
        box.appendChild(row);
        results.appendChild(box);
      }

      if (body) {
        const box = document.createElement('div');
        box.className = 'body-box';
        const h3 = document.createElement('h3');
        h3.textContent = '📄 本文';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = '📋 全文コピー';
        copyBtn.addEventListener('click', () => copyText(copyBtn, body));
        h3.appendChild(copyBtn);
        const bodyDiv = document.createElement('div');
        bodyDiv.className = 'body-text';
        bodyDiv.textContent = body;
        box.appendChild(h3);
        box.appendChild(bodyDiv);
        results.appendChild(box);
      }

      if (changes) {
        const box = document.createElement('div');
        box.className = 'change-box';
        box.innerHTML = '<h3>✅ 変更ポイント</h3>';
        const p = document.createElement('p');
        p.textContent = changes;
        box.appendChild(p);
        results.appendChild(box);
      }

      results.classList.add('show');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderNew(text) {
      const results = document.getElementById('results');

      // タブバー
      const tabBar = document.createElement('div');
      tabBar.className = 'tab-bar';

      const labels = ['パターン1', 'パターン2', 'パターン3'];
      const panels = [];

      labels.forEach((label, i) => {
        const n = i + 1;
        const subject = parseSection(text, `パターン${n}件名`);
        const body = parseSection(text, `パターン${n}本文`);
        const points = parseSection(text, `パターン${n}改善ポイント`);

        // タブボタン
        const tabBtn = document.createElement('button');
        tabBtn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        tabBtn.textContent = label;
        tabBtn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.pattern-panel').forEach(p => p.classList.remove('active'));
          tabBtn.classList.add('active');
          panels[i].classList.add('active');
        });
        tabBar.appendChild(tabBtn);

        // パネル
        const panel = document.createElement('div');
        panel.className = 'pattern-panel' + (i === 0 ? ' active' : '');

        // 件名
        if (subject) {
          const subjectBox = document.createElement('div');
          subjectBox.className = 'subject-box';
          subjectBox.innerHTML = '<h3>✉ 件名</h3>';
          const row = document.createElement('div');
          row.className = 'subject-row';
          const span = document.createElement('span');
          span.className = 'subject-text';
          span.textContent = subject;
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'コピー';
          btn.addEventListener('click', () => copyText(btn, subject));
          row.appendChild(span);
          row.appendChild(btn);
          subjectBox.appendChild(row);
          panel.appendChild(subjectBox);
        }

        // 本文
        if (body) {
          const bodyBox = document.createElement('div');
          bodyBox.className = 'body-box';
          const h3 = document.createElement('h3');
          h3.textContent = '📄 本文';
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.textContent = '📋 全文コピー';
          copyBtn.addEventListener('click', () => copyText(copyBtn, body));
          h3.appendChild(copyBtn);
          const bodyDiv = document.createElement('div');
          bodyDiv.className = 'body-text';
          bodyDiv.textContent = body;
          bodyBox.appendChild(h3);
          bodyBox.appendChild(bodyDiv);
          panel.appendChild(bodyBox);
        }

        // 改善ポイント
        if (points) {
          const insightBox = document.createElement('div');
          insightBox.className = 'insight-box';
          insightBox.innerHTML = '<h3>💡 なぜこのメルマガが売れるのか</h3>';
          const p = document.createElement('p');
          p.textContent = points;
          insightBox.appendChild(p);
          panel.appendChild(insightBox);
        }

        panels.push(panel);
      });

      results.appendChild(tabBar);
      panels.forEach(p => results.appendChild(p));

      results.classList.add('show');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ コピー済み';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
